<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>画像縮小アプリ - Image Resizer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .main-content {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 60px 20px;
            text-align: center;
            background: #f8f9ff;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 30px;
        }

        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f1ff;
            transform: translateY(-2px);
        }

        .upload-area.dragover {
            border-color: #764ba2;
            background: #e8e9ff;
        }

        .upload-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }

        .upload-text {
            font-size: 1.2em;
            color: #667eea;
            margin-bottom: 10px;
        }

        .upload-hint {
            color: #888;
            font-size: 0.9em;
        }

        #fileInput {
            display: none;
        }

        .options-panel {
            display: none;
            margin-top: 30px;
        }

        .options-panel.active {
            display: block;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
            font-size: 0.9em;
        }

        input[type="number"],
        select {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s ease;
        }

        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            margin-top: 10px;
        }

        .checkbox-group input[type="checkbox"] {
            margin-right: 8px;
            width: 18px;
            height: 18px;
        }

        .preview-area {
            display: none;
            margin-bottom: 30px;
        }

        .preview-area.active {
            display: block;
        }

        .preview-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .preview-box {
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }

        .preview-title {
            font-weight: 600;
            margin-bottom: 15px;
            color: #667eea;
        }

        .preview-img {
            max-width: 100%;
            max-height: 300px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .preview-info {
            font-size: 0.9em;
            color: #666;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn-success {
            background: #10b981;
            color: white;
        }

        .btn-success:hover {
            background: #059669;
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .alert {
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .alert.active {
            display: block;
        }

        .alert-error {
            background: #fee;
            color: #c33;
            border: 2px solid #fcc;
        }

        .alert-success {
            background: #efe;
            color: #3c3;
            border: 2px solid #cfc;
        }

        .features {
            margin-top: 40px;
            padding-top: 40px;
            border-top: 2px solid #e0e0e0;
        }

        .features h2 {
            text-align: center;
            color: #667eea;
            margin-bottom: 30px;
        }

        .feature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .feature-item {
            text-align: center;
            padding: 20px;
        }

        .feature-icon {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .feature-title {
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        .feature-desc {
            color: #666;
            font-size: 0.9em;
        }

        @media (max-width: 768px) {
            .preview-grid {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 2em;
            }

            .main-content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🖼️ 画像縮小アプリ</h1>
            <p class="subtitle">TIFF対応の高性能画像リサイズツール</p>
        </header>

        <div class="main-content">
            <div id="alert" class="alert"></div>

            <div id="uploadArea" class="upload-area">
                <div class="upload-icon">📤</div>
                <div class="upload-text">画像をドラッグ＆ドロップ</div>
                <div class="upload-hint">または、クリックしてファイルを選択</div>
                <div class="upload-hint" style="margin-top: 10px;">対応形式: JPEG, PNG, WebP, TIFF, AVIF, GIF</div>
                <input type="file" id="fileInput" accept="image/*">
            </div>

            <div id="optionsPanel" class="options-panel">
                <h2 style="margin-bottom: 20px; color: #667eea;">⚙️ リサイズ設定</h2>

                <div class="form-grid">
                    <div class="form-group">
                        <label for="width">幅 (ピクセル)</label>
                        <input type="number" id="width" placeholder="例: 800" min="1">
                    </div>

                    <div class="form-group">
                        <label for="height">高さ (ピクセル)</label>
                        <input type="number" id="height" placeholder="例: 600" min="1">
                    </div>

                    <div class="form-group">
                        <label for="quality">品質 (1-100)</label>
                        <input type="number" id="quality" value="80" min="1" max="100">
                    </div>

                    <div class="form-group">
                        <label for="format">出力形式</label>
                        <select id="format">
                            <option value="">元の形式のまま</option>
                            <option value="jpeg">JPEG</option>
                            <option value="png">PNG</option>
                            <option value="webp">WebP</option>
                            <option value="tiff">TIFF</option>
                            <option value="avif">AVIF</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="fit">フィットモード</label>
                        <select id="fit">
                            <option value="inside">Inside (収める)</option>
                            <option value="outside">Outside (覆う)</option>
                            <option value="cover">Cover (カバー)</option>
                            <option value="contain">Contain (包含)</option>
                            <option value="fill">Fill (埋める)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>&nbsp;</label>
                        <div class="checkbox-group">
                            <input type="checkbox" id="maintainAspect" checked>
                            <label for="maintainAspect" style="margin: 0;">アスペクト比を維持</label>
                        </div>
                    </div>
                </div>

                <div class="button-group">
                    <button id="resizeBtn" class="btn btn-primary">🔄 リサイズ実行</button>
                    <button id="resetBtn" class="btn btn-secondary">🔄 リセット</button>
                </div>
            </div>

            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p>画像を処理中...</p>
            </div>

            <div id="previewArea" class="preview-area">
                <h2 style="margin-bottom: 20px; color: #667eea;">👀 プレビュー</h2>

                <div class="preview-grid">
                    <div class="preview-box">
                        <div class="preview-title">元の画像</div>
                        <img id="originalPreview" class="preview-img" alt="Original">
                        <div id="originalInfo" class="preview-info"></div>
                    </div>

                    <div class="preview-box">
                        <div class="preview-title">リサイズ後</div>
                        <img id="resizedPreview" class="preview-img" alt="Resized">
                        <div id="resizedInfo" class="preview-info"></div>
                    </div>
                </div>

                <div class="button-group">
                    <button id="downloadBtn" class="btn btn-success">⬇️ ダウンロード</button>
                    <button id="newImageBtn" class="btn btn-secondary">🆕 新しい画像を選択</button>
                </div>
            </div>

            <div class="features">
                <h2>✨ 主な機能</h2>
                <div class="feature-grid">
                    <div class="feature-item">
                        <div class="feature-icon">📁</div>
                        <div class="feature-title">TIFF対応</div>
                        <div class="feature-desc">TIFFファイルの入出力に完全対応</div>
                    </div>
                    <div class="feature-item">
                        <div class="feature-icon">⚡</div>
                        <div class="feature-title">高速処理</div>
                        <div class="feature-desc">Sharp.jsによる高速な画像処理</div>
                    </div>
                    <div class="feature-item">
                        <div class="feature-icon">🎨</div>
                        <div class="feature-title">多様な形式</div>
                        <div class="feature-desc">JPEG, PNG, WebP, AVIF等に対応</div>
                    </div>
                    <div class="feature-item">
                        <div class="feature-icon">⚙️</div>
                        <div class="feature-title">柔軟な設定</div>
                        <div class="feature-desc">品質、サイズ、フィットモードを調整可能</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
